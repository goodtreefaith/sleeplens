[workspace]
members = ["crates/sleeplens-core", "crates/sleeplens-cli", "app/src-tauri"]
# app/src-tauri can join the workspace when the desktop shell is added.
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
